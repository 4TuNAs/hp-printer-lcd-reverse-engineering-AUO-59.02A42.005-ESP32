<rect x="374" y="230" width="255" height="92" rx="9" fill="#fef9c3" stroke="#eab308"/>
<text x="502" y="252" text-anchor="middle" font-size="15" font-weight="700">Full-res clock layer ≈16 KB</text>
<text x="502" y="273" text-anchor="middle" font-size="13">sky + mountains lookup tables</text>
<text x="502" y="293" text-anchor="middle" font-size="13">background built during scanout</text>
