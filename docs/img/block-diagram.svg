  <text x="707" y="452" text-anchor="middle" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fff">AUO 59.02A42.005 — D0-D7 + DCLK + HSYNC + VSYNC</text>
  <line x1="707" y1="392" x2="707" y2="424" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
