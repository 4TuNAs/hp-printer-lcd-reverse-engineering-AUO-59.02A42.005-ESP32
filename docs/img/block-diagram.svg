<text x="40" y="71" fill="#475569" font-size="15">I2S0 + DMA output is continuous; the CPU prepares scanline buffers ahead of DMA</text>
<rect x="40" y="108" width="270" height="240" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
