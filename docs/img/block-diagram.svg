<text x="175" y="176" text-anchor="middle" font-size="17" font-weight="700">netTask</text>
<text x="175" y="195" text-anchor="middle" font-size="13">Wi-Fi → NTP → Open-Meteo</text>
<text x="175" y="212" text-anchor="middle" font-size="13">Wi-Fi off between updates</text>
<rect x="62" y="246" width="225" height="77" rx="9" fill="#dcfce7" stroke="#4ade80"/>
<text x="175" y="270" text-anchor="middle" font-size="17" font-weight="700">controlTask</text>
